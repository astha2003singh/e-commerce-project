<div class="container mt-4">
    <div *ngIf="loading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  
    <div *ngIf="product && !loading" class="row">
      <div class="col-md-6">
        <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item" [class.active]="i === 0" *ngFor="let image of product.images; let i = index">
              <img [src]="image" class="d-block w-100" [alt]="product.title" style="height: 400px; object-fit: cover;">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>
      
      <div class="col-md-6">
        <h1>{{product.title}}</h1>
        <p class="text-muted">Brand: {{product.brand}}</p>
        <p class="text-muted">Category: {{product.category}}</p>
        
        <div class="mb-3">
          <span class="h3 text-primary">${{product.price}}</span>
          <span class="text-success ms-2">{{product.discountPercentage}}% off</span>
        </div>
        
        <div class="mb-3">
          <span class="text-warning">★ {{product.rating}}</span>
        </div>
        
        <p>{{product.description}}</p>
        
        <div class="mb-3">
          <strong>Stock: {{product.stock}} available</strong>
        </div>
        
        <div class="row mb-3">
          <div class="col-md-4">
            <label for="quantity" class="form-label">Quantity:</label>
            <input type="number" class="form-control" id="quantity" 
                   [(ngModel)]="quantity" min="1" [max]="product.stock">
          </div>
        </div>
        
        <div class="d-grid gap-2 d-md-flex">
          <button class="btn btn-success btn-lg" (click)="addToCart()" [disabled]="quantity > product.stock">
            Add to Cart
          </button>
          <button class="btn btn-outline-secondary btn-lg" (click)="goBack()">
            Back to Products
          </button>
        </div>
      </div>
    </div>
  </div>

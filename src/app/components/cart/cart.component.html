<div class="container mt-4">
    <div class="row">
      <div class="col-12">
        <h2>Shopping Cart</h2>
        <hr>
      </div>
    </div>
  
    <div *ngIf="cartItems.length === 0" class="text-center">
      <h4>Your cart is empty</h4>
      <button class="btn btn-primary mt-3" routerLink="">Continue Shopping</button>
    </div>
  
    <div *ngIf="cartItems.length > 0">
      <div class="row">
        <div class="col-md-8">
          <div class="card mb-3" *ngFor="let item of cartItems">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-md-3">
                  <img [src]="item.product.thumbnail" [alt]="item.product.title" 
                       class="img-fluid" style="max-height: 100px; object-fit: cover;">
                </div>
                <div class="col-md-4">
                  <h5>{{item.product.title}}</h5>
                  <p class="text-muted mb-0">${{item.product.price}} each</p>
                </div>
                <div class="col-md-3">
                  <div class="input-group">
                    <button class="btn btn-outline-secondary" type="button" 
                            (click)="updateQuantity(item.product.id, item.quantity - 1)">-</button>
                    <input type="number" class="form-control text-center" 
                           [value]="item.quantity" readonly>
                    <button class="btn btn-outline-secondary" type="button" 
                            (click)="updateQuantity(item.product.id, item.quantity + 1)">+</button>
                  </div>
                </div>
                <div class="col-md-2 text-end">
                  <h6>${{(item.product.price * item.quantity).toFixed(2)}}</h6>
                  <button class="btn btn-sm btn-outline-danger" 
                          (click)="removeFromCart(item.product.id)">Remove</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5>Order Summary</h5>
              <hr>
              <div class="d-flex justify-content-between mb-2">
                <span>Items ({{getTotalItems()}})</span>
                <span>${{getTotalPrice().toFixed(2)}}</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Shipping</span>
                <span>Free</span>
              </div>
              <hr>
              <div class="d-flex justify-content-between mb-3">
                <strong>Total</strong>
                <strong>${{getTotalPrice().toFixed(2)}}</strong>
              </div>
              <div class="d-grid gap-2">
                <button class="btn btn-success" (click)="proceedToOrder()" 
                        [disabled]="cartItems.length === 0">
                  Place Order
                </button>
                <button class="btn btn-outline-primary" routerLink="">
                  Continue Shopping
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

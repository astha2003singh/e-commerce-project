<div class="container py-5">
  <div class="row align-items-center mb-4">
    <div class="col-md-8">
      <p class="text-primary fw-semibold mb-2">Product collection</p>
      <h2 class="fw-bold mb-0">Browse all products</h2>
    </div>
    <div class="col-md-4 text-md-end">
      <a class="btn btn-outline-primary" routerLink="/">Back to home</a>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="row g-4" *ngIf="!loading">
    <div class="col-md-6 col-lg-4 col-xl-3" *ngFor="let product of products">
      <div class="card product-card h-100 shadow-sm">
        <img [src]="product.thumbnail" class="card-img-top" [alt]="product.title" />
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title mb-0">{{ product.title }}</h5>
            <span class="rating-pill">★ {{ product.rating }}</span>
          </div>
          <p class="card-text text-muted small flex-grow-1">{{ product.description | slice:0:90 }}...</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="price-tag">${{ product.price }}</span>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-primary btn-sm" (click)="viewProduct(product.id)">Details</button>
              <button class="btn btn-primary btn-sm" (click)="addToCart(product)">Add</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
